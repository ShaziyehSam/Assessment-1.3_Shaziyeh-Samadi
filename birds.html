<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Australian Birds</title>

  <style>
  :root {
  --primary-color: #e07a5f;
  --secondary-color: #ffffff;
  --bg-color: #f4f1de;
  --font-color: #2f2f2f;
  --heading-color: #3d405b;
}

[data-theme="dark"] {
  --primary-color: #ee6c4d;
  --secondary-color: #415a77;
  --bg-color: #1b263b;
  --font-color: #ffffff;
  --heading-color: #f4d35e;
}

  body {
  margin: 0;
  min-height: 100vh;
  background-color: var(--bg-color);
  color: var(--font-color);
  font-family: Arial, sans-serif;
  text-align: center;
}

main {
  width: 90%;
  max-width: 800px;
  margin: 0 auto;
  padding: 30px 0;
}

h1 {
  color: var(--heading-color);
  font-size: 3rem;
}

.bird-display {
  background-color: var(--secondary-color);
  padding: 25px;
  border-radius: 12px;
}

#bird-image {
  width: 100%;
  max-width: 600px;
  height: 400px;
  object-fit: cover;
  border-radius: 10px;
}

#bird-description {
  font-size: 1.2rem;
  line-height: 1.6;
}

.bird-buttons {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 20px 0;
}

button {
  padding: 10px 18px;
  background-color: var(--primary-color);
  color: var(--font-color);
  border: none;
  border-radius: 6px;
  font-size: 1rem;
  cursor: pointer;
}

button:hover {
  opacity: 0.8;
}
</style>
</head>

<body>
  <main>
    <h1>Australian Birds</h1>

    <section class="bird-display">
  <img id="bird-image" src="http://www.outgrabe.net/bird00.jpg" alt="Pardalote">

  <p id="bird-description">
    Pardalote by fir0002 (CC-by-NC)
  </p>
</section>

<section class="bird-buttons">
 <button id="pardalote-button">Pardalote</button>
 <button id="swamp-hen-button">Purple Swamp Hen</button>
 <button id="stilt-button">White-headed Stilt</button>
 <button id="thornbill-button">Inland Thornbill</button>
 <button id="robin-button">Rose Robin</button>
</section>

<button id="theme-toggle">Toggle Theme</button>
  </main>

  <script>
    // Selects the image and description elements

  const birdImage = document.getElementById("bird-image");
  const birdDescription = document.getElementById("bird-description");
// Updates the displayed bird image, alternative text and description
  function showBird(image, name, description) {
    birdImage.src = image;
    birdImage.alt = name;
    birdDescription.textContent = description;
  }
// Changes the bird when a bird button is clicked
  document.getElementById("pardalote-button").addEventListener("click", function () {
  showBird(
    "http://www.outgrabe.net/bird00.jpg",
    "Pardalote",
    "Pardalote by fir0002 (CC-by-NC)"
  );
});

document.getElementById("swamp-hen-button").addEventListener("click", function () {
  showBird(
    "http://www.outgrabe.net/bird01.jpg",
    "Purple Swamp Hen",
    "Purple swamp hen by Toby Hudson (CC-by-SA)"
  );
});

document.getElementById("stilt-button").addEventListener("click", function () {
  showBird(
    "http://www.outgrabe.net/bird02.jpg",
    "White-headed Stilt",
    "White-headed Stilt by JJ Harrison (CC-by-SA)"
  );
});

document.getElementById("thornbill-button").addEventListener("click", function () {
  showBird(
    "http://www.outgrabe.net/bird03.jpg",
    "Inland Thornbill",
    "Inland Thornbill by Peter Jacobs (CC-by-SA)"
  );
});

document.getElementById("robin-button").addEventListener("click", function () {
  showBird(
    "http://www.outgrabe.net/bird04.jpg",
    "Rose Robin",
    "Rose Robin by JJ Harrison (CC-by-SA)"
  );
});
// Switches between the light and dark colour themes
function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute("data-theme");
  const newTheme = currentTheme === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", newTheme);
}

document.getElementById("theme-toggle").addEventListener("click", toggleTheme);
</script>
</body>
</html>
