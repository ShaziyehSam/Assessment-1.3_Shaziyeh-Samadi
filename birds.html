<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Australian Birds</title>

  <style>
  :root {
    --background: #f4f1de;
    --surface: #ffffff;
    --heading: #3d405b;
    --text: #2f2f2f;
    --accent: #e07a5f;
  }

  body.dark-theme {
    --background: #1b263b;
    --surface: #415a77;
    --heading: #f4d35e;
    --text: #ffffff;
    --accent: #ee6c4d;
  }

  body {
  margin: 0;
  min-height: 100vh;
  background-color: var(--background);
  color: var(--text);
  font-family: Arial, sans-serif;
  text-align: center;
}

main {
  width: 90%;
  max-width: 800px;
  margin: 0 auto;
  padding: 30px 0;
}

h1 {
  color: var(--heading);
  font-size: 3rem;
}

.bird-display {
  background-color: var(--surface);
  padding: 25px;
  border-radius: 12px;
}

#bird-image {
  width: 100%;
  max-width: 600px;
  height: 400px;
  object-fit: cover;
  border-radius: 10px;
}

#bird-description {
  font-size: 1.2rem;
  line-height: 1.6;
}

.bird-buttons {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 20px 0;
}

button {
  padding: 10px 18px;
  background-color: var(--accent);
  color: var(--text);
  border: none;
  border-radius: 6px;
  font-size: 1rem;
  cursor: pointer;
}

button:hover {
  opacity: 0.8;
}
</style>
</head>

<body>
  <main>
    <h1>Australian Birds</h1>

    <section class="bird-display">
  <img id="bird-image" src="images/kookaburra.jpg" alt="Kookaburra">

  <p id="bird-description">
    The laughing kookaburra is famous for its loud call, which sounds like laughter.
  </p>
</section>

<section class="bird-buttons">
  <button id="kookaburra-button">Kookaburra</button>
  <button id="magpie-button">Magpie</button>
  <button id="cockatoo-button">Cockatoo</button>
  <button id="lorikeet-button">Rainbow Lorikeet</button>
  <button id="emu-button">Emu</button>
</section>

<button id="theme-toggle">Switch Theme</button>
  </main>

  <script>
  const birdImage = document.getElementById("bird-image");
  const birdDescription = document.getElementById("bird-description");

  function showBird(image, name, description) {
    birdImage.src = image;
    birdImage.alt = name;
    birdDescription.textContent = description;
  }

  document.getElementById("kookaburra-button").addEventListener("click", function () {
  showBird(
    "images/kookaburra.jpg",
    "Kookaburra",
    "The laughing kookaburra is famous for its loud call, which sounds like laughter."
  );
});

document.getElementById("magpie-button").addEventListener("click", function () {
  showBird(
    "images/magpie.jpg",
    "Magpie",
    "The Australian magpie is known for its beautiful song and intelligent behaviour."
  );
});

document.getElementById("cockatoo-button").addEventListener("click", function () {
  showBird(
    "images/cockatoo.jpg",
    "Cockatoo",
    "The sulphur-crested cockatoo has white feathers and a bright yellow crest."
  );
});

document.getElementById("lorikeet-button").addEventListener("click", function () {
  showBird(
    "images/lorikeet.jpg",
    "Rainbow Lorikeet",
    "The rainbow lorikeet is a colourful parrot that feeds mainly on nectar and fruit."
  );
});

document.getElementById("emu-button").addEventListener("click", function () {
  showBird(
    "images/emu.jpg",
    "Emu",
    "The emu is a large flightless bird native to Australia."
  );
});

document.getElementById("theme-toggle").addEventListener("click", function () {
  document.body.classList.toggle("dark-theme");
});
</script>
</body>
</html>
